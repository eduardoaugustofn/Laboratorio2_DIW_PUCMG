<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Locadora do Dudu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="docs/img/logo.webp">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <div class="card cartao-cadastro shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1" id="titulo">Cadastro</h1>
        <p class="text-secondary small mb-4" id="subtitulo">O sistema só pode ser usado após o cadastro.</p>

        <div id="erro" class="alert alert-danger py-2 d-none"></div>

        <form id="formCadastro" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="tipo" class="form-label">Tipo de usuário</label>
              <select class="form-select" id="tipo">
                <option value="cliente">Cliente</option>
                <option value="empresa">Empresa (agente)</option>
                <option value="banco">Banco (agente)</option>
              </select>
            </div>
            <div class="col-md-8">
              <label for="nome" class="form-label" id="rotuloNome">Nome completo</label>
              <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="col-md-7">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-5">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" minlength="6" required>
              <div class="form-text" id="dicaSenha">Mínimo de 6 caracteres.</div>
            </div>
          </div>

          <div id="dadosCliente" class="mt-4">
            <hr>
            <h2 class="h6 text-uppercase text-secondary mb-3">Dados do contratante</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="rg" class="form-label">RG</label>
                <input type="text" class="form-control" id="rg" maxlength="20">
              </div>
              <div class="col-md-6">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14">
              </div>
              <div class="col-12">
                <label for="endereco" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="endereco">
              </div>
              <div class="col-12">
                <label for="profissao" class="form-label">Profissão</label>
                <input type="text" class="form-control" id="profissao">
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
              <h2 class="h6 text-uppercase text-secondary mb-0">Entidades empregadoras e rendimentos</h2>
              <button type="button" class="btn btn-outline-dark btn-sm" id="btnAddEmp">Adicionar</button>
            </div>
            <p class="small text-secondary">Até 3 empregadores, com o rendimento mensal de cada um.</p>
            <div id="empregadores"></div>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-danger d-none" id="btnExcluir">Excluir minha conta</button>
            <button type="submit" class="btn btn-dark ms-auto" id="btnSalvar">Cadastrar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
