<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container">
    <div class="card cartao-login shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Entrar</h1>
        <p class="text-secondary small mb-4">Acesse com o e-mail e a senha cadastrados.</p>

        <div id="erro" class="alert alert-danger py-2 d-none"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required autofocus>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" required>
          </div>
          <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>

        <p class="text-center small mt-3 mb-0">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>

    <div class="card cartao-contas">
      <div class="card-body p-3 small text-secondary">
        <strong class="text-body">Contas de teste</strong> (senha <code>123456</code>)<br>
        Cliente: mariana@email.com<br>
        Empresa: contato@horizonte.com<br>
        Banco: credito@alvorada.com
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script>
    const jaLogado = Sessao.obter();
    if (jaLogado) location.href = Sessao.paginaInicial(jaLogado);

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erro = document.getElementById('erro');
      erro.classList.add('d-none');

      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      if (!email || !senha) {
        erro.textContent = 'Informe o e-mail e a senha.';
        erro.classList.remove('d-none');
        return;
      }

      try {
        const lista = await api.listar('usuarios', { email });
        const usuario = lista.find((u) => u.senha === senha);
        if (!usuario) {
          erro.textContent = 'E-mail ou senha incorretos.';
          erro.classList.remove('d-none');
          return;
        }
        Sessao.entrar(usuario);
        location.href = Sessao.paginaInicial(usuario);
      } catch (err) {
        erro.textContent = 'Não foi possível acessar os dados. Tente novamente.';
        erro.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
