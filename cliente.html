<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos - Aluguel de Carros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="topo"></header>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h4 mb-0">Meus pedidos de aluguel</h1>
        <span class="text-secondary small">Acompanhe o status de cada pedido.</span>
      </div>
      <button class="btn btn-dark" id="btnNovo">Novo pedido</button>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 tabela-pedidos">
          <thead>
            <tr>
              <th>Nº</th>
              <th>Automóvel</th>
              <th>Período</th>
              <th>Crédito</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="listaPedidos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalPedido" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="formPedido" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="tituloModal">Novo pedido</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div id="erroPedido" class="alert alert-danger py-2 d-none"></div>
            <div id="parecerBox" class="alert alert-secondary py-2 d-none"></div>

            <div class="row g-3">
              <div class="col-12">
                <label for="automovel" class="form-label">Automóvel</label>
                <select class="form-select" id="automovel" required></select>
              </div>
              <div class="col-md-6">
                <label for="dataInicio" class="form-label">Retirada</label>
                <input type="date" class="form-control" id="dataInicio" required>
              </div>
              <div class="col-md-6">
                <label for="dataFim" class="form-label">Devolução</label>
                <input type="date" class="form-control" id="dataFim" required>
              </div>
              <div class="col-md-6">
                <label for="propriedade" class="form-label">Automóvel registrado como propriedade de</label>
                <select class="form-select" id="propriedade">
                  <option value="cliente">Cliente</option>
                  <option value="empresa">Empresa</option>
                  <option value="banco">Banco</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label d-block">Contrato de crédito</label>
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" id="comCredito">
                  <label class="form-check-label" for="comCredito">Associar a um crédito bancário</label>
                </div>
                <select class="form-select d-none" id="banco"></select>
              </div>
              <div class="col-12">
                <div class="border rounded p-2 bg-light small" id="resumo">Escolha o automóvel e o período.</div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="submit" class="btn btn-dark" id="btnSalvarPedido">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pedidos.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
